<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RentingRadar — Email Verification</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;background:#0d1117;color:#e6edf3;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .card{background:#161b22;border:1px solid #30363d;border-radius:16px;max-width:440px;width:100%;padding:40px 32px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.4)}
  .icon{font-size:48px;margin-bottom:16px}
  h1{font-size:1.4rem;font-weight:700;margin-bottom:8px}
  .msg{color:#8b949e;font-size:.92rem;line-height:1.6;margin-bottom:24px}
  .btn{display:inline-block;padding:11px 28px;font-size:.92rem;font-weight:600;border:none;border-radius:8px;cursor:pointer;font-family:inherit;text-decoration:none;transition:opacity .15s}
  .btn-primary{background:#2f81f7;color:#fff}
  .btn-primary:hover{opacity:.9}
  .spinner{display:inline-block;width:20px;height:20px;border:2px solid #30363d;border-top-color:#2f81f7;border-radius:50%;animation:spin .6s linear infinite;margin-bottom:16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .success{color:#3fb950}
  .error{color:#f85149}
  .field{text-align:left;margin-bottom:14px}
  .field label{display:block;font-size:.78rem;color:#8b949e;margin-bottom:6px}
  .field input{width:100%;padding:10px 12px;font-size:.95rem;font-family:inherit;color:#e6edf3;background:#0d1117;border:1px solid #30363d;border-radius:8px}
  .field input:focus{outline:none;border-color:#2f81f7}
  .show-pw{display:flex;align-items:center;gap:6px;font-size:.8rem;color:#8b949e;margin:-4px 0 18px;cursor:pointer;user-select:none}
  .form-err{min-height:20px;font-size:.82rem;color:#f85149;margin-bottom:14px;text-align:left}
  .btn[disabled]{opacity:.6;cursor:default}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spinner"></div>
  <h1>Verifying your email...</h1>
  <p class="msg">Please wait a moment.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
  var FIREBASE_CONFIG = {
    apiKey: 'AIzaSyAiWI-bB-HxFmvgiFSIuYLtFnv7BniFlQk',
    authDomain: 'auth.rentingradar.com',
    projectId: 'rentingradar',
    storageBucket: 'rentingradar.firebasestorage.app',
    messagingSenderId: '622768449810',
    appId: '1:622768449810:web:fde8ec3ba25a70643d2bcb'
  };
  firebase.initializeApp(FIREBASE_CONFIG);

  var params = new URLSearchParams(window.location.search);
  var mode = params.get('mode');
  var oobCode = params.get('oobCode');
  var card = document.getElementById('card');

  function showResult(icon, title, msg, showBtn) {
    card.innerHTML =
      '<div class="icon">' + icon + '</div>' +
      '<h1>' + title + '</h1>' +
      '<p class="msg">' + msg + '</p>' +
      (showBtn ? '<a class="btn btn-primary" href="https://app.rentingradar.com">Open RentingRadar</a>' : '');
  }

  if (mode === 'verifyEmail' && oobCode) {
    firebase.auth().applyActionCode(oobCode).then(function() {
      showResult('✅', 'Email Verified!',
        'Your email address has been confirmed. You can now access RentingRadar.', true);
    }).catch(function(err) {
      console.error('Verification error:', err);
      if (err.code === 'auth/expired-action-code') {
        showResult('⏰', 'Link Expired',
          'This verification link has expired. Please go back to the app and click "Resend Verification Email" to get a new link.', true);
      } else if (err.code === 'auth/invalid-action-code') {
        showResult('⚠️', 'Invalid or Used Link',
          'This link has already been used or is no longer valid. If your email is already verified, you can open the app. Otherwise, request a new verification email.', true);
      } else {
        showResult('❌', 'Verification Failed',
          'Something went wrong: ' + (err.message || 'Unknown error') + '. Please try again or contact support.', true);
      }
    });
  } else if (mode === 'resetPassword' && oobCode) {
    // Handled here, not on Firebase's default page. That page had a single
    // password field (one typo locks you out) and ran on
    // rentingradar.firebaseapp.com, which the API key's referrer allowlist
    // blocks, so every link failed as "expired".
    document.title = 'RentingRadar — Reset Password';
    card.innerHTML = '<div class="spinner"></div><h1>Checking your link...</h1><p class="msg">Please wait a moment.</p>';
    firebase.auth().verifyPasswordResetCode(oobCode).then(function(email) {
      renderResetForm(email);
    }).catch(function(err) {
      console.error('Reset code error:', err);
      showResetLinkError(err);
    });
  } else {
    showResult('❓', 'Invalid Link',
      'This link doesn\'t appear to be a valid verification link. Please check your email for the correct link.', true);
  }

  function escHtml(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function showResetLinkError(err) {
    var code = err && err.code;
    if (code === 'auth/expired-action-code') {
      showResult('⏰', 'Link Expired',
        'This password reset link has expired. Go back to the app, click "Forgot password?" and request a new one.', true);
    } else if (code === 'auth/invalid-action-code') {
      showResult('⚠️', 'Invalid or Used Link',
        'This reset link has already been used or was replaced by a newer one. Request a new link from the app and use the most recent email.', true);
    } else {
      showResult('❌', 'Reset Failed',
        'Something went wrong: ' + escHtml((err && err.message) || 'Unknown error') + '. Please try again or contact help@rentingradar.com.', true);
    }
  }

  function renderResetForm(email) {
    card.innerHTML =
      '<div class="icon">🔑</div>' +
      '<h1>Choose a New Password</h1>' +
      '<p class="msg">for <strong style="color:#e6edf3">' + escHtml(email) + '</strong></p>' +
      '<form id="resetForm" novalidate>' +
        '<div class="field"><label for="newPw">New password</label>' +
          '<input type="password" id="newPw" autocomplete="new-password" minlength="6" required></div>' +
        '<div class="field"><label for="confirmPw">Confirm new password</label>' +
          '<input type="password" id="confirmPw" autocomplete="new-password" minlength="6" required></div>' +
        '<label class="show-pw"><input type="checkbox" id="showPw"> Show passwords</label>' +
        '<div class="form-err" id="resetErr"></div>' +
        '<button type="submit" class="btn btn-primary" id="resetBtn" style="width:100%">Save New Password</button>' +
      '</form>';
    var form = document.getElementById('resetForm');
    var pw = document.getElementById('newPw');
    var pw2 = document.getElementById('confirmPw');
    var errEl = document.getElementById('resetErr');
    var btn = document.getElementById('resetBtn');
    document.getElementById('showPw').addEventListener('change', function() {
      var t = this.checked ? 'text' : 'password';
      pw.type = t; pw2.type = t;
    });
    pw.focus();
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      errEl.textContent = '';
      if (pw.value.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; pw.focus(); return; }
      if (pw.value !== pw2.value) { errEl.textContent = "Passwords don't match. Please re-type them."; pw2.focus(); return; }
      btn.disabled = true; btn.textContent = 'Saving...';
      firebase.auth().confirmPasswordReset(oobCode, pw.value).then(function() {
        showResult('✅', 'Password Updated',
          'Your password has been changed. You can now sign in to RentingRadar with your new password.', true);
      }).catch(function(err) {
        console.error('confirmPasswordReset error:', err);
        if (err && err.code === 'auth/weak-password') {
          btn.disabled = false; btn.textContent = 'Save New Password';
          errEl.textContent = 'That password is too weak. Use at least 6 characters.';
        } else if (err && (err.code === 'auth/expired-action-code' || err.code === 'auth/invalid-action-code')) {
          showResetLinkError(err);
        } else {
          btn.disabled = false; btn.textContent = 'Save New Password';
          errEl.textContent = 'Could not save: ' + ((err && err.message) || 'Unknown error');
        }
      });
    });
  }
</script>
</body>
</html>
